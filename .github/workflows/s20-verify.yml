name: verify
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: install
        run: npm install
      - name: test (lint, build, coverage)
        run: npm run test
      - name: tsc
        run: npm run tsc
